# Integration file: GHA
name: LoggerService Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux-agent]

    env:
      VAULT_URL: ${{ secrets.VAULT_URL }}
      CICD_TOKEN: ${{ secrets.CICD_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Retrieve Env Vars from Vault
        run: |
          echo "Requesting environment variables from Vault..."

          response=$(curl -sS --fail-with-body \
            -X POST \
            -H "X-CICD-TOKEN: $CICD_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"serviceName":"loggerservice","environmentName":"e3"}' \
            "$VAULT_URL/api/vault/cicd") || {
              echo "Unable to retrieve environment variables from Vault"
              exit 1
            }

          if [ -z "$response" ]; then
            echo "Vault returned an empty environment file"
            exit 1
          fi

          printf '%s\n' "$response" > loggerservice.env

          echo "Environment variables written to loggerservice.env"

      - name: Deploy
        run: |
          set -e

          docker compose --env-file loggerservice.env up --build --wait
          
          echo "All containers are up and healthy."

      - name: Cleanup
        if: always()
        run: |
          rm -f loggerservice.env
          echo "Cleaned up loggerservice.env"
